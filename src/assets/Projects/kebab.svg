<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none" role="img" aria-label="Kebab Project">
  <!-- Wrap seen end-on: one large cone so the shape survives at small sizes -->
  <path d="M25 6 L37 40 H13 Z" fill="#E8B862"/>
  <!-- Filling bands: meat, salad, sauce -->
  <path d="M18 29h14l1.5 4.5H16.5z" fill="#8C3B1E"/>
  <path d="M20 22h10l1.5 4.5H18.5z" fill="#4A9B46"/>
  <path d="M22 15h6l1.5 4.5H20.5z" fill="#C8552A"/>
  <!-- Fold line down the front of the wrap -->
  <path d="M25 8v30" stroke="#A86C1C" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <!-- Base -->
  <rect x="12" y="40" width="26" height="3.4" rx="1.7" fill="#D99B33"/>
  <!-- Steam -->
  <g stroke="#E8B862" stroke-width="1.4" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M19 48c0-2 2-2 2-4"/>
    <path d="M25 49c0-2 2-2 2-4"/>
    <path d="M31 48c0-2 2-2 2-4"/>
  </g>
</svg>
